name: baymaxv1
description: "Baymax — personal health companion: vitals check-ups with the Baymax device, OTC guidance with safety checks, medication reminders and clinic visits."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_bluetooth_serial_plus: ^0.5.1
  permission_handler: ^11.0.0
  provider: ^6.1.2
  http: ^1.2.1
  pdf: ^3.10.8
  path_provider: ^2.1.3
  share_plus: ^10.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_timezone: ^5.1.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/liquid_glass.frag

  assets:
    - assets/fonts/OFL-Figtree.txt

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
